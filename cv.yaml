    teaching_experience:
    - name: 'INFO 601: Foundations of Information'
      location: Pratt Institute, School of Information
      start_date: '2026'
      end_date: '2026'
      summary: 'Graduate seminar. Enrolment: 18 students. Contact hours: 3 hours/week. Years taught: Fall
        2026.'
      highlights:
      - This foundational course focuses on the intersection of people, information, and technology and
        the theoretical and conceptual foundations of the information field. Students are introduced to
        ideas and ethical and inclusive principles that inform future specializations in their course
        of study and provide concrete strategies for ongoing professional growth and development in their
        area of interest. Through analysis of professional and scholarly discourse, students practice
        expressing their points of view on issues vital to the field.
    - name: 'INFO 664: Programming for Cultural Heritage'
      location: Pratt Institute, School of Information
      start_date: '2026'
      end_date: '2026'
      summary: 'Graduate seminar. Enrolment: 18 students. Contact hours: 3 hours/week. Years taught: Fall
        2026.'
      highlights:
      - This course examines the emerging field of linked open data and its application in the world of
        digital and/or physical libraries and museums. The overall objective is to ideate and then create
        a linked open data project, requiring reading and research on existing projects and standards
        as well as the acquisition of software and programming skills (Python) needed to make the project
        work. This course is not a general introduction to programming or computer science, but serves
        as an excellent starting point for further study.
    - name: 'DM-GY 6063 A: Creative Coding'
      location: New York University, Tandon School of Engineering
      start_date: '2025'
      end_date: '2025'
      summary: 'Graduate studio. Enrolment: 18 students. Contact hours: 3 hours/week. Years taught: Fall
        2025.'
      highlights:
      - A graduate-level programming course that emphasizes the creative possibilities of code. Unlike
        a typical software engineering course, this is a hands-on studio that challenges students to go
        beyond linear thinking around algorithms, examining and discussing code-based art and design and
        writing and iterating code-based projects through creative experimentation. By the end of the
        course, students are empowered to interpret and create code-based artworks including interactive
        installations, gestural interfaces, generative visualizations, experimental games, A/V experiences,
        and more.
    - name: 'DM-GY 921X C: Independent Study in Design & Media: Speculative Networks'
      location: New York University, Tandon School of Engineering
      start_date: '2025'
      end_date: '2025'
      summary: 'Graduate seminar/studio (independent study). Enrolment: 3 students. Contact hours: 3 hours/week.
        Years taught: Fall 2025.'
      highlights:
      - This independent study focuses on the ethical, political and socio-cultural dimensions of digital
        platforms and social media. Readings explore the implications of digital design practices, and
        creative assignments provide a means to creatively reimagine digital platforms through speculative
        design methods. Through a combination of seminar discussions, workshops and digital design projects,
        students critically examine and remediate social media and other digital platforms.
    - name: 'DM-GY 9103 G: Special Topics in Digital Media – Affective Interfaces'
      location: New York University, Tandon School of Engineering
      start_date: '2024'
      end_date: '2025'
      summary: 'Graduate seminar/studio. Enrolment: 18 students. Contact hours: 3 hours/week. Years taught:
        Spring 2024, Spring 2025.'
      highlights:
      - Students experiment with interfaces that engage with human emotions. Leveraging techniques in
        machine learning, physical computing, haptic media, bio-sensing, sound, gestural interfaces and
        facial recognition, students create experimental emotionally aware technologies, challenging the
        ways that emotion and affect are construed and captured by dominant platforms. This is a project-based
        course in which students explore novel modes of expression collaboratively and through individual
        projects.
    - name: 'DM-UY 4913-B: Data Visceralization'
      location: New York University, Tandon School of Engineering
      start_date: '2024'
      end_date: '2025'
      summary: 'Undergraduate studio. Enrolment: 18 students. Contact hours: 3 hours/week. Years taught:
        Spring 2024, Spring 2025.'
      highlights:
      - A hands-on, project-based studio course that pushes beyond typical notions of data visualization,
        examining ways that data can be transformed into embodied experiences. Students engage with techniques
        in physical computing, haptic technologies and VR toward the creation of a series of unconventional
        data visualizations, each interpreting dynamic data sets to convey complex phenomena such as climate
        change through tactile and embodied forms of representation.
    - name: 'DM-UY 1133-D: Creative Coding'
      location: New York University, Tandon School of Engineering
      start_date: '2023'
      end_date: '2024'
      summary: 'Studio. Enrolment: 18 students. Contact hours: 4 hours/week. Years taught: Fall 2023,
        Fall 2024.'
      highlights:
      - An introductory programming course that emphasizes the creative possibilities of code. Unlike
        a typical software engineering course, this is a hands-on studio that challenges students to go
        beyond linear thinking around algorithms, examining and discussing code-based art and design and
        writing and iterating code-based projects through creative experimentation. By the end of the
        course, students are empowered to interpret and create code-based artworks including interactive
        installations, gestural interfaces, generative visualizations, experimental games, A/V experiences,
        and more.
    - name: 'DM-GY 9103 G: Special Topics in Digital Media – Speculative Networks'
      location: New York University, Tandon School of Engineering
      start_date: '2023'
      end_date: '2024'
      summary: 'Graduate seminar/studio. Enrolment: 18 students. Contact hours: 3 hours/week. Years taught:
        Fall 2023, Fall 2024.'
      highlights:
      - This course focuses on the ethical, political and socio-cultural dimensions of digital platforms
