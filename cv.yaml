    - name: 'COMS 3202: Digital Discourse and Design'
      location: York University
      start_date: '2019'
      end_date: '2022'
      summary: 'Seminar. Enrolment: 20 students. Contact hours: 3 hours/week. Years taught: Fall 2019,
        Fall 2020, Fall 2021, Fall 2022.'
      highlights:
      - A seminar focusing on the ethical, political and socio-cultural dimensions of digital communications
        technologies. Through a combination of seminar discussions, analytical writing exercises and creative
        design projects, students critically examine and intervene upon digital communication systems.
    - name: 'RTA 221: Experiential Media and Interdisciplinary Practice'
      location: Toronto Metropolitan University
      start_date: '2019'
      end_date: '2020'
      summary: 'Lecture. Enrolment: 80 students (2019), 90 students (2020). Contact hours: 3 hours/week.
        Years taught: Winter 2019, Winter 2020.'
      highlights:
      - A lecture course focused on the function of media in the context of experience design and contemporary
        art. Students explore topics such as phenomenology, intersectionality, remediation and political
        economy in relation to contemporary art practices.
    - name: 'MADT 315: A/V for Performance and Installation'
      location: Alberta University of the Arts
      start_date: '2014'
      end_date: '2018'
      summary: 'Studio. Enrolment: 22 students. Contact hours: 6 hours/week (2014-2016), 4.5 hours/week
        (2016-2018). Years taught: Fall 2014, Winter 2016, Winter 2017, Winter 2018 (4 total).'
      highlights:
      - A studio course that introduces students to tools and strategies for integrating audio, video
        and interactivity into installation and performance works. Students develop installation and performance
        work through instructor-led workshops in topics such as projection mapping, spatial audio, immersive
        environments, interactive interfaces, live cinema, audio performance and experimental narrative.
    - name: 'MADT 307: Computational Art'
      location: Alberta University of the Arts
      start_date: '2013'
      end_date: '2017'
      summary: 'Studio. Enrolment: 22 students. Contact hours: 6 hours/week (2013-2016), 4.5 hours/week
        (2016-2017). Years taught: Fall 2013, Fall 2014, Fall 2015, Fall 2016, Fall 2017 (5 total).'
      highlights:
      - An introductory course in programming, focused on the development of media artworks. Students
        work with Processing and Max/MSP to develop sound, video, performance and interactive artworks.
    - name: 'MADT 304: Interactive Object II'
      location: Alberta University of the Arts
      start_date: '2015'
      end_date: '2017'
      summary: 'Studio. Enrolment: 22 students. Contact hours: 6 hours/week (2015-2016), 4.5 hours/week
