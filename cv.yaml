        3D
    - label: Programming languages
      details: C-sharp, Python, Processing, Arduino, Max, JavaScript, HTML and CSS, Unity3D, P5.js, ML5.js,
        RunwayML, TouchDesigner, TensorFlow, node.js
    - label: Hardware / tech skills
      details: Multitrack audio recording, live audio/video, video production, studio lighting, in-camera
        video and film techniques, circuit design and fabrication, woodworking and metalworking, image
        editing, risography
